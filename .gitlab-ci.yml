generate-sbom:
  stage: scan
  image:
    name: asia-northeast1-docker.pkg.dev/woo-orderly/orderly-security/syft:v1.43.0
  script:
    - |
      syft ${CI_PROJECT_DIR} -o cyclonedx-json=syft.cdx.json
      REPORT_LINK=${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/external_file/syft.cdx.json
      echo "Report Link: ${REPORT_LINK}"
  artifacts:
    expire_in: 30 day
    paths:
      - syft.cdx.json
    reports:
      cyclonedx: 
        - syft.cdx.json
  tags:
    - dev
    - build
  
osv-audit:
  stage: scan
  image: 
    name: asia-northeast1-docker.pkg.dev/woo-orderly/orderly-security/osv-scanner:v2.3.5
  needs: 
    - job: generate-sbom
      artifacts: true
  script:
    - |
      curl -X POST -H 'Content-type: application/json' \
      --data "{\"text\":\"🦊 <https://gitlab.com/${GITLAB_USER_LOGIN}|${GITLAB_USER_LOGIN}> trigger <${CI_PROJECT_URL}/-/pipelines/${CI_PIPELINE_ID}|pipeline> to do security scan.\"}" \
      ${SLACK_HOOK_URL}

      osv-scanner scan source -L syft.cdx.json --format=table --output-file=osv_summary.json || EXIT_CODE=$?
      osv-scanner scan source -L syft.cdx.json --format=json --output-file=osv_details.json || EXIT_CODE=$?

      if [ -z "$EXIT_CODE" ] || [ "$EXIT_CODE" -eq 0 ]; then
        echo "No vulnerabilities were found"
      else
        echo "Detected vulnerabilities"
        cat osv_summary.json

      REPORT_SUMMARY_LINK=${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/external_file/osv_summary.json
      echo "Report Summary Link: ${REPORT_SUMMARY_LINK}"

      REPORT_DETAILS_LINK=${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/external_file/osv_details.json
      echo "Report Details Link: ${REPORT_DETAILS_LINK}"

      curl -X POST -H 'Content-type: application/json' \
      --data "{\"text\":\"👽 Detected vulnerabilities: <${REPORT_SUMMARY_LINK}|summary>, <${REPORT_DETAILS_LINK}|details> in <${CI_PROJECT_URL}/-/pipelines/${CI_PIPELINE_ID}|pipeline>\"}" \
      ${SLACK_HOOK_URL}

      fi
  artifacts:
    expire_in: 30 day
    paths:
      - osv_summary.json
      - osv_details.json
    reports:
      sast:
        - osv_details.json
  tags:
    - dev
    - build