  - scan
  - check_tag
  - build_docker
  - deploy
  - post-build-audit
  - release

variables:
  SLACK_HOOK_URL: "https://hooks.slack.com/services/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"
