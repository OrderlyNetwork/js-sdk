include:
  - project: "orderlynetwork/orderly-fe/common-ci"
    ref: main
    file: "momorepo-release.yaml"

# === [必须] step 1: 引入安全扫描相关 gitlab ci 脚本 ===
  - project: "orderlynetwork/orderly-security/orderly-security-templates"
    ref: main
    file: "npm-security-baseline.yml"

# === [必须] step 2：重新定义/排序 stages ===
# 主要引入 scan 和 post-build-audit 两个 stages，其中：
# stage scan 要在 build docker 前
# stage post-build-audit 要在 build docker 后
stages:
  - scan             # 在 build_docker 前
  - check_tag
  - build_docker
  - post-build-audit # 在 build_docker 后
  - deploy
  - release

# === [必须] step 3：定义 variables ===
variables:
  # 测试用，需要迁移到 gitlab cicd variable
  # SLACK_HOOK_URL: "https://hooks.slack.com/services/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"
  SLACK_HOOK_URL: "https://hooks.slack.com/services/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"

  # 服务名称
  SERVICE_NAME: "orderly-web"

  # 镜像名称，一般和 SERVICE_NAME 一致，可根据需要覆盖
  # IMAGE_NAME: ${SERVICE_NAME}
  IMAGE_NAME: "storybook"
  
  # 镜像 tag，一般和 git tag 一致，可根据需要覆盖
  IMAGE_TAG: ${CI_COMMIT_TAG}

  # # 镜像完整名称，可根据需要覆盖
  APP_IMAGE_TAG: "asia-northeast1-docker.pkg.dev/woo-orderly/orderly-network/${IMAGE_NAME}:${IMAGE_TAG}"

  # ENABLE_PUBLISH 表示是否只打包/构建 npm，不打包 docker 镜像，只打包/构建 npm 时不需要扫描 docker 镜像
  # ENABLE_PUBLISH 默认值为 false，表示同时打包/构建 npm 和 docker 镜像
  ENABLE_PUBLISH: "false"

# === [可选] step 4：根据条件重定义 variables ===
workflow:
  rules:
    # 如果有 git tag，使用 git tag 作为 image tag
    - if: $CI_COMMIT_TAG
      variables:
        ENABLE_PUBLISH: "false"
        IMAGE_TAG: $CI_COMMIT_TAG
    
    # 当前分支是 internal 或 pre-release 只 publish npm，不打包镜像
    # - if: '($CI_COMMIT_BRANCH =~ /^internal\// || $CI_COMMIT_BRANCH =~ /^pre-release/) && $CI_COMMIT_MESSAGE =~ /publish/'
    - if: $CI_COMMIT_BRANCH == "cicd-erik" # 这里 cicd-erik 是测试分支，后续需要调整
      variables:
        ENABLE_PUBLISH: "true"
        IMAGE_TAG: "$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"

    - when: always
      variables:
        ENABLE_PUBLISH: "false"
        IMAGE_TAG: "$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"

